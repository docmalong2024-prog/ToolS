name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract ZIP File
        run: |
          if [ -f "DucTri_ToolStore_Full_Project_For_GitHub_APK.zip" ]; then
            unzip -o DucTri_ToolStore_Full_Project_For_GitHub_APK.zip
          elif ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Capacitor & Android
        run: |
          npm install -D @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps
          npx cap init "DucTri ToolStore" "com.ductri.toolstore" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK File
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DucTri-ToolStore-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
